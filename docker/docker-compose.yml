x-node: &node
  image: raft-kv
  build: { context: .., dockerfile: docker/Dockerfile }
  restart: unless-stopped
  stop_grace_period: 10s
  healthcheck:
    test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8001/readyz"]
    interval: 2s
    timeout: 2s
    retries: 15

services:
  node1:
    <<: *node
    command: --node-id=n1 --data-dir=/data --peers=n1=node1:9001,n2=node2:9001,n3=node3:9001 --peer-http=n1=node1:8001,n2=node2:8001,n3=node3:8001
    ports: ["8001:8001"]
    volumes: ["node1-data:/data"]
  node2:
    <<: *node
    command: --node-id=n2 --data-dir=/data --peers=n1=node1:9001,n2=node2:9001,n3=node3:9001 --peer-http=n1=node1:8001,n2=node2:8001,n3=node3:8001
    ports: ["8002:8001"]
    volumes: ["node2-data:/data"]
    depends_on: { node1: { condition: service_started } }
  node3:
    <<: *node
    command: --node-id=n3 --data-dir=/data --peers=n1=node1:9001,n2=node2:9001,n3=node3:9001 --peer-http=n1=node1:8001,n2=node2:8001,n3=node3:8001
    ports: ["8003:8001"]
    volumes: ["node3-data:/data"]
    depends_on: { node1: { condition: service_started } }

volumes:
  node1-data:
  node2-data:
  node3-data:
